<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Campeonato · LANCEBALL</title>
<link rel="stylesheet" href="/arena.css">
<body class="preview-page">
<!-- ARENA_HEADER -->
<main>
<div class="page-intro">
<h1>Teste da Champions League</h1>
<p>Escolha quantas equipes seriam humanas. A demonstração preenche as vagas com bots e gera placares de teste para conferir a tabela e os cruzamentos.</p></div>
<form class="panel">
<input type="hidden" name="mode" value="ucl">
<label>Participantes humanos<input name="humans" type="number" min="1" max="8" value="2" required></label>
<label>Equipes no campeonato<select name="size"><option>4</option><option>6</option><option>8</option></select></label><button class="primary">Simular campeonato</button>
</form>
<p id="status" role="status"></p>
<div id="results"></div>
</main>
<script type="module">
const form = document.querySelector('form');
const setup = new URLSearchParams(location.search);
if (['4', '6', '8'].includes(setup.get('size'))) form.elements.size.value = setup.get('size');
if (setup.get('team')) form.elements.humans.value = '1';
const results = document.querySelector('#results');
const status = document.querySelector('#status');
const score = match => {
  const suffix = match.penalties ? ' · vitória de ' + match.winner.name + ' nos pênaltis'
    : match.extraTime ? ' · após prorrogação' : '';
  const aggregate = match.aggregate ? ' · agregado ' + match.aggregate.join(' × ') : '';
  return match.home + ' ' + match.homeGoals + ' × ' + match.awayGoals + ' ' + match.away + aggregate + suffix;
};
function section(title, lines) {
  const panel = document.createElement('section');
  panel.className = title.startsWith('Final') ? 'panel result-final' : 'panel';
  const heading = document.createElement('h2');
  heading.textContent = title;
  const list = document.createElement('ol');
  for (const line of lines) {
    const item = document.createElement('li');
    if (typeof line === 'string') {
      item.textContent = line;
    } else {
      const logo = document.createElement('img');
      logo.src = line.crestUrl;
      logo.alt = '';
      logo.width = 26;
      logo.height = 26;
      logo.style.cssText = 'object-fit:contain;vertical-align:middle;margin-right:.5rem';
      logo.addEventListener('error', () => logo.remove());
      item.append(logo, line.text);
    }
    list.append(item);
  }
  panel.append(heading, list);
  return panel;
}
form.onsubmit = async event => {
  event.preventDefault();
  const button = form.querySelector('button');
  button.disabled = true;
  status.textContent = '';
  try {
    const settings = new URLSearchParams(new FormData(form));
    for (const key of ['team', 'club']) {
      if (setup.has(key)) settings.set(key, setup.get(key));
    }
    const response = await fetch('/tournament-preview?' + settings);
    const data = await response.json();
    if (!response.ok) throw Error(data.error);
    results.replaceChildren(
      section('Equipes', data.teams.map(team => {
        const text = [team.name, team.club].filter(Boolean).join(' · ');
        return team.crestUrl ? { text, crestUrl: team.crestUrl } : text;
      })),
      ...data.firstPhase.flatMap(group => [
        section(group.name + ' · Classificação', group.standings.map(team =>
          team.name + ' · ' + team.points + ' pts · saldo ' + (team.scored - team.conceded))),
        section(group.name + ' · Jogos', group.matches.map(score)),
      ]),
      ...data.semifinalRounds.map(round => section(round.name, round.matches.map(score))),
      ...(data.thirdPlace ? [section('Disputa de terceiro lugar', [score(data.thirdPlace)])] : []),
      section('Final · Campeão: ' + data.final.winner.name, [score(data.final)]),
    );
    status.textContent = 'Campeonato simulado. Campeão: ' + data.final.winner.name + '.';
  } catch (error) {
    status.textContent = error.message;
  } finally {
    button.disabled = false;
  }
};
</script>
</body>
</html>
